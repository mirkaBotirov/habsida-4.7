<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iintoo registration</title>

    <link rel="stylesheet" href="https://www.fontsquirrel.com/fonts/download/barlow">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">
            <img src="img/bg.jpg" alt="Hero" class="hero-img">
            <img src="img/logo.svg" alt="iintoo logo" class="logo">
        </div>

        <!-- RIGHT SIDE -->
         <div class="right">
            <div class="form-wrapper">

                <h1>Get intoo it today</h1>
                <p class="subtitle">There is no charge or obligation upon registration.</p>

                <div class="social-buttons">
                    <button class="btn fb">
                        <img src="img/facebook.svg" alt="">
                        Register with Facebook
                    </button>

                    <button class="btn in">
                        <img src="img/linkedin.svg" alt="">
                        Register with LinkedIn
                    </button>
                </div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="inputs">
                    <input type="email" placeholder="Email">
                    <input type="text" placeholder="Phone">
                </div>

                <h3>What type of investor are you?</h3>
                <p class="small">Select the type of investor you are below.</p>

                <div class="radio-group">
                    <label><input type="radio" name="investor" checked>Individual</label>
                    <label><input type="radio" name="investor">Business</label>
                    <label><input type="radio" name="investor">IRA</label>
                    <label><input type="radio" name="investor">Trust</label>
                </div>

                <div class="checkbox">
                    <label>
                        <input type="checkbox">
                        I agree to the terms and receiving notifications from iintoo 
                        <a href="">View full terms</a>
                    </label>
                </div>

                <button class="create-account">Create Account</button>

            </div>
         </div>


    </div>

    
</body>
</html>
